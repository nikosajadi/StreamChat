<!DOCTYPE html>
<!--
  StreamChat - public/index.html
  Page skeleton only: login screen + 3-column messenger layout
  (contacts, chat with emoji picker, server log).
  All behavior lives in app.js, all styling in style.css.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreamChat</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- ============ Login ============
     Shown first. Submitting the form calls the server's `register` method;
     on success this screen is hidden and #app is shown. -->
<div id="login" class="login">
  <form id="loginForm" class="login-card">
    <div class="logo">◐</div>
    <h1>StreamChat</h1>
    <p class="muted">Pick a name to join the network</p>
    <input id="nameInput" maxlength="24" placeholder="Your name" autocomplete="off" autofocus />
    <button type="submit">Join</button>
    <div id="loginError" class="error"></div>
  </form>
</div>

<!-- ============ App ============
     Main messenger UI: contacts | chat | server log.
     Hidden (.hidden) until the user has registered. -->
<div id="app" class="app hidden">

  <!-- Sidebar: my profile + connection state, search box, and the contact
       list (#contacts is filled by renderContacts() in app.js). -->
  <aside class="sidebar">
    <header class="side-head">
      <div class="me">
        <div id="meAvatar" class="avatar"></div>
        <div>
          <div id="meName" class="me-name"></div>
          <div id="connState" class="conn on">connected</div>
        </div>
      </div>
      <button id="toggleLogs" class="icon-btn" title="Toggle server log">⌘</button>
    </header>
    <div class="search"><input id="search" placeholder="Search contacts" /></div>
    <div class="section-title">Contacts <span id="onlineCount"></span></div>
    <ul id="contacts" class="contacts"></ul>
  </aside>

  <!-- Chat: #emptyChat is shown until a contact is selected; #chatView holds
       the peer header, the message list and the composer form. -->
  <main class="chat">
    <div id="emptyChat" class="empty">
      <div class="logo big">◐</div>
      <p>Select a contact to start chatting</p>
    </div>

    <div id="chatView" class="chat-view hidden">
      <header class="chat-head">
        <div id="peerAvatar" class="avatar"></div>
        <div>
          <div id="peerName" class="peer-name"></div>
          <div id="peerStatus" class="peer-status"></div>
        </div>
      </header>
      <div id="messages" class="messages"></div>
      <!-- Composer: emoji button + picker panel, text input, send button.
           #emojiPanel is filled with emoji buttons by app.js the first time
           it opens; it floats above the input box. -->
      <form id="composer" class="composer">
        <button type="button" id="emojiBtn" class="emoji-btn" title="Emoji" aria-label="Open emoji picker" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M8.5 14.5c.9 1.2 2.1 1.8 3.5 1.8s2.6-.6 3.5-1.8" />
            <circle cx="9" cy="10" r=".8" fill="currentColor" />
            <circle cx="15" cy="10" r=".8" fill="currentColor" />
          </svg>
        </button>
        <div id="emojiPanel" class="emoji-panel hidden" role="dialog" aria-label="Emoji picker"></div>
        <input id="msgInput" placeholder="Write a message…" autocomplete="off" />
        <button type="submit" title="Send">➤</button>
      </form>
    </div>
  </main>

  <!-- Server / socket log: live feed of `server:log` events from the server
       plus local CLIENT events. Toggled with the ⌘ button. -->
  <section id="logs" class="logs">
    <header class="logs-head">
      <span>Server &amp; Socket Log</span>
      <button id="clearLogs" class="link-btn">clear</button>
    </header>
    <div id="logList" class="log-list"></div>
  </section>
</div>

<!-- Socket.IO client library (served automatically by the server) -->
<script src="/socket.io/socket.io.js"></script>
<!-- Client application logic -->
<script src="/app.js"></script>
</body>
</html>
